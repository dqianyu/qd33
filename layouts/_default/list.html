{{ partial "header.html" . }}

<div class="container page">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ with .Pages }}
  <ul class="page-list">
    {{ range . }}
    <li><span class="muted">{{ .Date.Format "2006" }}</span> <a href="{{ .Permalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</div>

{{ partial "footer.html" . }}
