{{/* Decorative ridgeline background. Separate light/dark files because some browsers
     (notably iOS Safari) ignore prefers-color-scheme inside SVGs loaded as images.
     Both versions are rendered and CSS shows the one for the current theme, so the
     light/dark toggle can switch them. */}}
<picture>
  <source media="(max-width: 860px)" srcset="{{ "images/ridges-mobile-light.svg" | absURL }}">
  <img class="{{ .class }} show-light" src="{{ "images/ridges-light.svg" | absURL }}" alt="" aria-hidden="true"{{ with .style }} style="{{ . | safeCSS }}"{{ end }}>
</picture>
<picture>
  <source media="(max-width: 860px)" srcset="{{ "images/ridges-mobile-dark.svg" | absURL }}">
  <img class="{{ .class }} show-dark" src="{{ "images/ridges-dark.svg" | absURL }}" alt="" aria-hidden="true"{{ with .style }} style="{{ . | safeCSS }}"{{ end }}>
</picture>
