</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <span>© {{ now.Year }}</span>
    {{/* The homepage already shows these links in the hero */}}
    {{ if not .IsHome }}{{ partial "profile-links.html" . }}{{ end }}
  </div>
</footer>
<script>
  // Assemble the mailto link on interaction so the address isn't in the HTML for scrapers.
  document.querySelectorAll(".js-email").forEach(function (a) {
    var set = function () { a.href = "mailto:" + a.dataset.user + "@" + a.dataset.domain; };
    a.addEventListener("mouseenter", set);
    a.addEventListener("focus", set);
    a.addEventListener("touchstart", set, { passive: true });
  });

  // Light/dark toggle. With no saved choice the site follows the system setting.
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".js-theme-toggle");
    if (!btn) return;
    var systemDark = window.matchMedia("(prefers-color-scheme: dark)");
    var current = function () { return root.dataset.theme || (systemDark.matches ? "dark" : "light"); };
    var label = function () {
      var next = current() === "dark" ? "light" : "dark";
      btn.setAttribute("aria-label", "Switch to " + next + " mode");
      btn.dataset.label = next === "dark" ? "Dark mode" : "Light mode";
    };
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });
    systemDark.addEventListener("change", label);
    label();
  })();
</script>
</body>
</html>
