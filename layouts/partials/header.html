<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ $title := cond .IsHome site.Title (printf "%s · %s" .Title site.Title) }}
  {{ $desc := .Description | default site.Params.description }}
  <title>{{ $title }}</title>
  <meta name="description" content="{{ $desc }}">
  {{ with site.Params.googleSiteVerification }}<meta name="google-site-verification" content="{{ . }}">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ site.Params.photo | absURL }}">
  <meta name="twitter:card" content="summary">
  <script>
    // Apply a saved light/dark choice before the page paints, so there is no flash of the other theme.
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ "images/favicon.svg" | absURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.Permalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<button type="button" class="icon-btn theme-toggle js-theme-toggle" aria-label="Switch to dark mode" data-label="Dark mode">{{ partial "icon.html" "moon" | replaceRE "<svg " "<svg class=\"show-light\" " | safeHTML }}{{ partial "icon.html" "sun" | replaceRE "<svg " "<svg class=\"show-dark\" " | safeHTML }}</button>

{{ if not .IsHome }}
<nav class="container back-home" aria-label="Breadcrumb"><a href="{{ site.Home.Permalink }}">← {{ site.Title }}</a></nav>

<main id="main">
